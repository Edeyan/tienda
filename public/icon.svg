<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer rounded square -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- BUSINESS Iconography: Stylized bold modern "B" -->
  <g filter="url(#shadow)">
    <!-- Base structural B in navy and white -->
    <path d="M150 120 H280 C340 120 375 150 375 205 C375 240 350 265 315 275 C360 285 390 315 390 365 C390 425 345 455 280 455 H150 Z" 
          fill="#ffffff" />
    <!-- Cutouts for the B loops to give depth -->
    <path d="M215 175 H270 C305 175 325 190 325 215 C325 240 305 255 270 255 H215 Z" 
          fill="#ea580c" />
    <path d="M215 315 H275 C315 315 335 332 335 360 C335 388 315 405 275 405 H215 Z" 
          fill="#ea580c" />
    <!-- Dynamic wing/accent slash -->
    <path d="M150 120 L215 120 L215 455 L150 455 Z" fill="#002147" opacity="0.95"/>
  </g>
</svg>
